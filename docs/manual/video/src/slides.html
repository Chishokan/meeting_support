<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=block">
<style>
/* 1920×1080 の1コマ。上に手順の帯、左に画面写真、右に字幕。時間は render(t) で外から進める。 */
:root {
  --bg: #eef2f6;
  --paper: #ffffff;
  --ink: #1c2430;
  --muted: #5b6573;
  --navy: #1f4e78;
  --navy-soft: #e3edf7;
  --line: #d6dde5;
  --mark: #e0262f;
  --warn: #b86e0a;
  --warn-bg: #fff3df;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body { font-family: 'BIZ UDPGothic', sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; }

/* 上の帯：いまの手順 */
.bar {
  position: absolute; left: 0; right: 0; top: 0; height: 112px; padding: 0 64px;
  display: flex; align-items: center; justify-content: space-between; background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.bar .name { font-size: 30px; font-weight: 700; color: var(--navy); letter-spacing: .04em; }
.bar .name small { font-size: 22px; color: var(--muted); font-weight: 400; margin-left: 18px; letter-spacing: 0; }
.chips { display: flex; align-items: center; gap: 12px; }
.chip {
  display: flex; align-items: center; gap: 10px; padding: 10px 22px 10px 12px; border-radius: 999px;
  border: 2px solid var(--line); color: var(--muted); font-size: 24px; font-weight: 700; background: var(--paper);
}
.chip i {
  font-style: normal; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: var(--navy-soft); color: var(--navy); font-size: 22px;
}
.chip.on { border-color: var(--navy); background: var(--navy); color: #fff; }
.chip.on i { background: #fff; color: var(--navy); }
.chip.done { color: var(--navy); border-color: var(--navy-soft); }
.chips .arrow { color: #9aa6b4; font-size: 26px; }

/* 写真のコマ */
.slide { position: absolute; left: 0; right: 0; top: 112px; bottom: 0; display: none; }
.slide.on { display: block; }
.stage {
  position: absolute; left: 64px; top: 52px; width: 1160px; height: 868px; overflow: hidden;
  background: #f5f6f8; border: 1px solid var(--line); border-radius: 20px;
}
.cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.cam img { display: block; }
.cam svg { position: absolute; left: 0; top: 0; }
.hl { position: absolute; border: 5px solid var(--mark); border-radius: 12px; box-shadow: 0 0 0 4px rgba(255,255,255,.85); }
.cap {
  position: absolute; left: 1272px; right: 64px; top: 52px; bottom: 52px;
  display: flex; flex-direction: column; justify-content: center; gap: 28px;
}
.cap .k { font-size: 26px; font-weight: 700; color: var(--navy); letter-spacing: .1em; }
.cap h2 { margin: 0; font-size: 50px; line-height: 1.32; text-wrap: balance; }
.cap p { margin: 0; font-size: 30px; line-height: 1.72; color: #2b3542; text-wrap: pretty; }
.cap h2, .cap .note, .cap .tip, .center p { text-wrap: pretty; }
.cap .note {
  font-size: 25px; line-height: 1.6; padding: 16px 22px; border-radius: 14px;
  background: var(--warn-bg); color: var(--warn); font-weight: 700;
}
.cap .tip {
  font-size: 25px; line-height: 1.6; padding: 16px 22px; border-radius: 14px;
  background: var(--navy-soft); color: var(--navy); font-weight: 700;
}
.btn { display: inline-block; padding: 0 12px; border-radius: 10px; background: var(--navy-soft); color: var(--navy); font-weight: 700; }

/* 文字だけのコマ */
.center {
  position: absolute; left: 64px; right: 64px; top: 52px; bottom: 52px; background: var(--paper);
  border: 1px solid var(--line); border-radius: 20px; display: flex; flex-direction: column;
  justify-content: center; align-items: center; gap: 36px; text-align: center; padding: 0 120px;
}
.center h1 { margin: 0; font-size: 92px; color: var(--navy); letter-spacing: .02em; }
.center h2 { margin: 0; font-size: 60px; line-height: 1.35; }
.center .lead { font-size: 36px; color: var(--muted); }
.center p { margin: 0; font-size: 34px; line-height: 1.7; color: #2b3542; max-width: 1300px; }
.flow { display: flex; gap: 28px; align-items: stretch; }
.flow .card {
  width: 362px; border: 3px solid var(--navy); border-radius: 22px; padding: 30px 26px; text-align: left;
  display: flex; flex-direction: column; gap: 12px; background: var(--paper);
}
.flow .card .k { font-size: 24px; color: var(--navy); font-weight: 700; letter-spacing: .1em; }
.flow .card b { font-size: 37px; line-height: 1.3; white-space: nowrap; }
.flow .card span { font-size: 25px; color: var(--muted); line-height: 1.55; text-wrap: pretty; }
.flow .to { align-self: center; font-size: 46px; color: var(--navy); font-weight: 700; }
.loopback {
  border: 3px dashed var(--navy); border-radius: 18px; padding: 16px 40px; font-size: 32px; color: var(--navy); font-weight: 700;
}
.rec { display: flex; gap: 70px; align-items: center; text-align: left; }
.rec .icon {
  width: 300px; height: 300px; border-radius: 50%; background: var(--navy-soft); display: grid; place-items: center; flex: none;
}
.rec .txt { display: flex; flex-direction: column; gap: 26px; max-width: 980px; }
.rec .txt h2 { font-size: 56px; }
table.tm { border-collapse: collapse; font-size: 38px; }
table.tm th, table.tm td { border: 2px solid var(--line); padding: 18px 56px; }
table.tm th { background: var(--navy-soft); }
table.tm td.v { font-weight: 700; color: var(--navy); }
.recap { display: grid; grid-template-columns: repeat(2, 640px); gap: 26px 40px; text-align: left; }
.recap div { display: flex; gap: 22px; align-items: flex-start; font-size: 31px; line-height: 1.55; }
.recap i {
  font-style: normal; flex: none; width: 58px; height: 58px; border-radius: 14px; background: var(--navy); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 30px;
}
.foot { position: absolute; left: 64px; right: 64px; bottom: 12px; font-size: 20px; color: #8a95a3; text-align: right; }
</style>
</head>
<body>
<div class="bar">
  <div class="name">部門会議の進め方<small>会議DX 動画マニュアル</small></div>
  <div class="chips" id="chips"></div>
</div>
<div id="slides"></div>
<div class="foot">画面の会議名・人名・数値は説明用の架空の例です</div>

<script src="data.js"></script>
<script>
// data.js が SLIDES（台本）と SHOTS（画面写真の大きさと枠の位置）を入れる。
const STEPS = ['事前共有', '録音', '議事録', '次回の事前共有'];
const host = document.getElementById('slides');
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3));
const clamp = (x) => Math.max(0, Math.min(1, x));
const CW = 1160, CH = 868;

function chipsHtml(step) {
  return STEPS.map((s, i) => {
    const n = i + 1;
    const cls = n === step ? 'on' : step && n < step ? 'done' : '';
    return `<span class="chip ${cls}"><i>${n}</i>${s}</span>` + (n < 4 ? '<span class="arrow">›</span>' : '');
  }).join('');
}

function buildShot(s) {
  const shot = SHOTS[s.shot];
  const boxes = shot.boxes.filter((b) => s.focus.includes(b.n));
  const u = boxes.reduce((a, b) => ({
    x1: Math.min(a.x1, b.x), y1: Math.min(a.y1, b.y), x2: Math.max(a.x2, b.x + b.w), y2: Math.max(a.y2, b.y + b.h),
  }), { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity });
  const s0 = Math.min(CW / shot.w, CH / shot.h);
  const bw = u.x2 - u.x1, bh = u.y2 - u.y1;
  let s1 = Math.min(CW * 0.84 / bw, CH * 0.8 / bh, s0 * (s.maxZoom || 1.7), 1.45);
  if (s.noZoom || s1 < s0) s1 = s0;
  const place = (sc, cx, cy) => {
    const W = shot.w * sc, H = shot.h * sc;
    let tx = W <= CW ? (CW - W) / 2 : Math.min(0, Math.max(CW - W, CW / 2 - cx * sc));
    let ty = H <= CH ? (CH - H) / 2 : Math.min(0, Math.max(CH - H, CH / 2 - cy * sc));
    return { tx, ty, sc };
  };
  const from = place(s0, shot.w / 2, shot.h / 2);
  const to = place(s1, (u.x1 + u.x2) / 2, (u.y1 + u.y2) / 2);
  const holes = boxes.map((b) => `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="12" fill="#000"/>`).join('');
  const el = document.createElement('section');
  el.className = 'slide';
  el.innerHTML = `
    <div class="stage"><div class="cam" style="width:${shot.w}px;height:${shot.h}px">
      <img src="shots/${s.shot}.png" width="${shot.w}" height="${shot.h}" alt="">
      <svg width="${shot.w}" height="${shot.h}" class="dim" style="overflow:visible"><defs><mask id="m-${s.id}" maskUnits="userSpaceOnUse" x="-4000" y="-4000" width="${shot.w + 8000}" height="${shot.h + 8000}">
        <rect x="-4000" y="-4000" width="${shot.w + 8000}" height="${shot.h + 8000}" fill="#fff"/>${holes}</mask></defs>
        <rect x="-4000" y="-4000" width="${shot.w + 8000}" height="${shot.h + 8000}" fill="rgba(16,28,44,.42)" mask="url(#m-${s.id})"/></svg>
      ${boxes.map((b) => `<div class="hl" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px"></div>`).join('')}
    </div></div>
    <div class="cap">${s.kicker ? `<div class="k">${s.kicker}</div>` : ''}<h2>${s.title}</h2>${s.body.map((p) => `<p>${p}</p>`).join('')}
      ${s.note ? `<div class="note">${s.note}</div>` : ''}${s.tip ? `<div class="tip">${s.tip}</div>` : ''}</div>`;
  const cam = el.querySelector('.cam');
  const dim = el.querySelector('.dim');
  const hls = [...el.querySelectorAll('.hl')];
  const cap = el.querySelector('.cap');
  const stage = el.querySelector('.stage');
  el.render = (t) => {
    const a = ease(clamp(t / 0.45));
    stage.style.opacity = a;
    cap.style.opacity = ease(clamp((t - 0.15) / 0.45));
    cap.style.transform = `translateY(${(1 - ease(clamp((t - 0.15) / 0.45))) * 24}px)`;
    const z = ease(clamp((t - 0.55) / 1.0));
    const tx = from.tx + (to.tx - from.tx) * z, ty = from.ty + (to.ty - from.ty) * z, sc = from.sc + (to.sc - from.sc) * z;
    cam.style.transform = `translate(${tx}px, ${ty}px) scale(${sc})`;
    const h = ease(clamp((t - 1.25) / 0.5));
    dim.style.opacity = h;
    hls.forEach((x) => { x.style.opacity = h; x.style.transform = `scale(${1.08 - 0.08 * h})`; });
  };
  el.animEnd = 1.8;
  return el;
}

function buildText(s) {
  const el = document.createElement('section');
  el.className = 'slide';
  el.innerHTML = `<div class="center">${s.html}</div>`;
  const items = [...el.querySelectorAll('[data-d]')];
  el.render = (t) => {
    el.querySelector('.center').style.opacity = ease(clamp(t / 0.4));
    items.forEach((x) => {
      const p = ease(clamp((t - Number(x.dataset.d)) / 0.45));
      x.style.opacity = p;
      x.style.transform = `translateY(${(1 - p) * 22}px)`;
    });
  };
  el.animEnd = Math.max(0.5, ...items.map((x) => Number(x.dataset.d) + 0.5));
  return el;
}

const built = SLIDES.map((s) => {
  const el = s.shot ? buildShot(s) : buildText(s);
  host.appendChild(el);
  return el;
});

// 外（コマ撮りのスクリプト）から呼ぶ。i 枚目を出し、その中の t 秒の状態にする。
window.show = (i, t) => {
  built.forEach((el, k) => el.classList.toggle('on', k === i));
  document.getElementById('chips').innerHTML = chipsHtml(SLIDES[i].step || 0);
  built[i].render(t);
  return built[i].animEnd;
};
window.ready = async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = r; im.onerror = r; }))));
  return [...document.images].filter((im) => !im.naturalWidth).map((im) => im.src);
};
</script>
</body>
</html>
